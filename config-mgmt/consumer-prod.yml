server:
  port: ${CONSUMER_PORT:8083}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

logging:
  level:
    root: ${LOG_LEVEL:INFO}
  file:
    name: ${CONSUMER_LOG_FILE:logs/consumer.log}
