server:
  port: ${PROVIDER_PORT:8081}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

logging:
  level:
    root: ${LOG_LEVEL:INFO}
  file:
    name: ${PROVIDER_LOG_FILE:logs/provider.log}
