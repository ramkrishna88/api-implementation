spring:
  datasource:
    url: ${USER_DB_URL:jdbc:h2:file:./data/userdb;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: org.h2.Driver
    username: ${USER_DB_USERNAME:sa}
    password: ${USER_DB_PASSWORD:}
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

logging:
  level:
    root: ${LOG_LEVEL:INFO}
  file:
    name: ${USER_SERVICE_LOG_FILE:logs/user-service.log}
