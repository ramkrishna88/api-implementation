server:
  port: ${GATEWAY_PORT:8080}

service:
  user:
    url: ${USER_SERVICE_URL:http://localhost:8081}
  product:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8082}
  order:
    url: ${ORDER_SERVICE_URL:http://localhost:8083}
  cart:
    url: ${CART_SERVICE_URL:http://localhost:8084}

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

logging:
  level:
    root: ${LOG_LEVEL:INFO}
  file:
    name: ${API_GATEWAY_LOG_FILE:logs/api-gateway.log}
