server:
  port: ${CONFIG_SERVER_PORT:8888}

spring:
  application:
    name: configserver
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:native}
  output:
    ansi:
      enabled: ALWAYS

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
  file:
    name: ${CONFIG_SERVER_LOG_FILE:logs/configserver.log}
