spring.config.activate.on-profile=prod

server.port=${EUREKA_SERVER_PORT:8761}
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=${EUREKA_REGISTER_WITH_EUREKA:false}
eureka.client.fetch-registry=${EUREKA_FETCH_REGISTRY:false}
eureka.server.enable-self-preservation=${EUREKA_SELF_PRESERVATION:true}
eureka.server.eviction-interval-timer-in-ms=${EUREKA_EVICTION_INTERVAL_MS:60000}

logging.level.root=${LOG_LEVEL:INFO}
logging.file.name=${EUREKA_LOG_FILE:logs/eureka.log}
