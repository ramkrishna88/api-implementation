spring.application.name=api-gateway
server.port=${SERVER_PORT:8080}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=api-gateway
info.app.description=API entry point for the ecommerce microservices
info.app.version=1.0

service.user.url=${USER_SERVICE_URL:http://localhost:8081}
service.product.url=${PRODUCT_SERVICE_URL:http://localhost:8082}
service.order.url=${ORDER_SERVICE_URL:http://localhost:8083}
service.cart.url=${CART_SERVICE_URL:http://localhost:8084}
spring.cloud.config.import-check.enabled=false
eureka.client.enabled=true
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


logging.level.root=INFO
logging.file.name=${API_GATEWAY_LOG_FILE:logs/api-gateway.log}
